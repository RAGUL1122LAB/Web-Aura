<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WEB AURA 2K26 — DESIGN. DEVELOP. DEPLOY. | GTA: San Andreas Edition</title>
    <meta name="description" content="WEB AURA 2K26 - The premier college technology hackathon and competition platform. 7 September 2026 at 9:00 AM." />
    <!-- Google Fonts for retro GTA San Andreas condensed & display typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Changa+One:ital@0;1&family=Oswald:wght@400;600;700&family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
      html, body, #root, * {
        cursor: url('/cursors/gta-cursor.png') 0 0, url('/cursors/gta-cursor.svg') 0 0, auto;
      }
      a, button, [role="button"], input[type="button"], input[type="submit"], select, summary, label[for], .cursor-pointer, [class*="cursor-pointer"], [onClick], [onclick] {
        cursor: url('/cursors/gta-pointer.png') 0 0, url('/cursors/gta-pointer.svg') 0 0, pointer !important;
      }
      input[type="text"], input[type="email"], input[type="password"], input[type="search"], input[type="number"], input[type="tel"], textarea, [contenteditable="true"] {
        cursor: text !important;
      }
      button:disabled, input:disabled, [aria-disabled="true"], .cursor-not-allowed {
        cursor: not-allowed !important;
      }
    </style>
  </head>
  <body class="bg-gta-black text-gta-black selection:bg-gta-orange selection:text-gta-black antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
